name: msme-poc

# Settings shared by both business services.
x-service-env: &service-env
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Kolkata}
  POSTGRES_HOST: db
  POSTGRES_PORT: 5432
  POSTGRES_DB: ${POSTGRES_DB:-msme}

x-service-healthcheck: &service-healthcheck
  interval: 10s
  timeout: 3s
  retries: 5
  start_period: 20s

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-msme}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-msme}
      INVOICE_DB_PASSWORD: ${INVOICE_DB_PASSWORD:?Set INVOICE_DB_PASSWORD in .env}
      CONTRACT_DB_PASSWORD: ${CONTRACT_DB_PASSWORD:?Set CONTRACT_DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  invoice-service:
    build: ./services/invoice-service
    environment:
      <<: *service-env
      DB_USER: invoice_svc
      DB_PASSWORD: ${INVOICE_DB_PASSWORD}
      INVOICE_AT_RISK_DAYS: ${INVOICE_AT_RISK_DAYS:-5}
      # Reminder emails (INV-004, ADR-0004). Defaults go to the local Mailpit inbox below.
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS:-accounts@msme-poc.local}
      REMINDER_SENDER_NAME: ${REMINDER_SENDER_NAME:-Accounts Team}
      SMTP_TIMEOUT_SECONDS: ${SMTP_TIMEOUT_SECONDS:-10}
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      <<: *service-healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health', timeout=2)"]

  # Local mail sink (INV-004, ADR-0004): reminder emails land here instead of reaching a real
  # client. Open the inbox at http://localhost:8025. Not used once SMTP_HOST points elsewhere.
  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "127.0.0.1:8025:8025"

  contract-service:
    build: ./services/contract-service
    environment:
      <<: *service-env
      DB_USER: contract_svc
      DB_PASSWORD: ${CONTRACT_DB_PASSWORD}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CONTRACT_LLM_MODEL: ${CONTRACT_LLM_MODEL:-claude-sonnet-5}
      CONTRACT_LLM_EFFORT: ${CONTRACT_LLM_EFFORT:-high}
      CONTRACT_EXTRACTOR: ${CONTRACT_EXTRACTOR:-claude}
      CONTRACT_AT_RISK_DAYS: ${CONTRACT_AT_RISK_DAYS:-3}
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      <<: *service-healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=2)"]

  # "Talk to Me" (AST-001): stateless, no database; reads the other two services' APIs.
  assistant-service:
    build: ./services/assistant-service
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Kolkata}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ASSISTANT_LLM: ${ASSISTANT_LLM:-claude}
      ASSISTANT_LLM_MODEL: ${ASSISTANT_LLM_MODEL:-claude-sonnet-5}
      ASSISTANT_LLM_EFFORT: ${ASSISTANT_LLM_EFFORT:-medium}
      # The small model that checks every question first (AST-002, ADR-0005).
      ASSISTANT_GUARD_MODEL: ${ASSISTANT_GUARD_MODEL:-claude-haiku-4-5-20251001}
      # So the app guide never states an outdated at-risk window.
      INVOICE_AT_RISK_DAYS: ${INVOICE_AT_RISK_DAYS:-5}
      CONTRACT_AT_RISK_DAYS: ${CONTRACT_AT_RISK_DAYS:-3}
      INVOICE_API_URL: http://invoice-service:8002
      CONTRACT_API_URL: http://contract-service:8001
    depends_on:
      invoice-service:
        condition: service_healthy
      contract-service:
        condition: service_healthy
    healthcheck:
      <<: *service-healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health', timeout=2)"]

  # React build served by Nginx (PLT-001).
  frontend:
    build: ./frontend

  # Vite dev server with hot reload, and the container used for npm commands:
  #   docker compose --profile dev up frontend-dev        → http://localhost:5173
  #   docker compose run --rm frontend-dev npm test
  frontend-dev:
    image: node:22-slim
    profiles: [dev]
    working_dir: /app
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      HOME: /tmp
      VITE_API_PROXY: http://gateway
    volumes:
      - ./frontend:/app
    ports:
      - "127.0.0.1:5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

  # End-to-end tests against the running stack:
  #   docker compose --profile e2e run --rm e2e
  e2e:
    image: mcr.microsoft.com/playwright:v1.49.0-noble
    profiles: [e2e]
    working_dir: /app
    user: "${UID:-1000}:${GID:-1000}"
    ipc: host
    init: true
    environment:
      HOME: /tmp
      BASE_URL: http://gateway
      MAILPIT_URL: http://mailpit:8025
      SAMPLES_DIR: /samples
      CI: "true"
    volumes:
      - ./frontend:/app
      - ./samples:/samples:ro
    depends_on:
      gateway:
        condition: service_healthy
    command: npx playwright test

  gateway:
    build: ./gateway
    environment:
      # Optional shared password for the whole app (PLT-003). Empty = open, as before.
      ACCESS_USERNAME: ${ACCESS_USERNAME:-user}
      ACCESS_PASSWORD: ${ACCESS_PASSWORD:-}
    ports:
      - "8080:80"
    depends_on:
      invoice-service:
        condition: service_healthy
      contract-service:
        condition: service_healthy
      assistant-service:
        condition: service_healthy
      frontend:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3

  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: [observability]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    depends_on: [invoice-service, contract-service, assistant-service]

  grafana:
    image: grafana/grafana:11.3.0
    profiles: [observability]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/msme-poc.json
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    depends_on: [prometheus]

volumes:
  pgdata:
  uploads:
