[project]
name = "contract-service"
version = "0.1.0"
description = "Contract upload, AI extraction and dashboard API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "structlog>=24.4",
    "prometheus-client>=0.21",
    "python-multipart>=0.0.18",
    "tzdata>=2024.2",
    "pdfplumber>=0.11.4",
    "python-docx>=1.1.2",
    "anthropic>=0.75",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.8",
    "fpdf2>=2.8",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
markers = [
    "slow: long-running tests (performance)",
    "llm: calls the real Claude API (needs ANTHROPIC_API_KEY and RUN_LLM_TESTS=1)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC"]
