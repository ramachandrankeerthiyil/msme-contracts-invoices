[project]
name = "assistant-service"
version = "0.1.0"
description = "Talk to Me: conversational answers about contracts and invoices (AST-001)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    # Only because app/core (shared, identical across services) imports it for the DB check.
    "sqlalchemy[asyncio]>=2.0.36",
    "structlog>=24.4",
    "prometheus-client>=0.21",
    "tzdata>=2024.2",
    "httpx>=0.27",
    "anthropic>=0.75",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
markers = [
    "llm: calls the real Claude API against the running stack (needs RUN_LLM_TESTS=1)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC"]
