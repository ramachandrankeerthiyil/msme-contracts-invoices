worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    # PLT-002 AC2: keep a well-formed incoming request ID, otherwise use Nginx's own.
    map $http_x_request_id $req_id {
        "~^[A-Za-z0-9._-]{8,64}$" $http_x_request_id;
        default                   $request_id;
    }

    map $status $log_level {
        ~^5     error;
        ~^4     warning;
        default info;
    }

    # PLT-002 AC3: one JSON access line per request, same shape as the services.
    log_format json escape=json
        '{"timestamp":"$time_iso8601","level":"$log_level","service":"gateway",'
        '"event":"http.access","message":"$request_method $uri $status",'
        '"request_id":"$req_id","method":"$request_method","path":"$uri",'
        '"status":$status,"duration_s":$request_time,"bytes":$body_bytes_sent,'
        '"upstream":"$upstream_addr"}';
    access_log /dev/stdout json;

    # Docker's DNS: resolve services per request, so the gateway starts (and serves the UI)
    # even while one service is down (PLT-001 AC10).
    resolver 127.0.0.11 valid=10s ipv6=off;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 21m;  # 20 MB contracts + multipart overhead

    server {
        listen 80;
        listen [::]:80;

        # The services echo the same ID; hide theirs so the response carries exactly one.
        proxy_hide_header X-Request-ID;
        add_header X-Request-ID $req_id always;

        proxy_set_header Host              $host;
        proxy_set_header X-Request-ID      $req_id;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_http_version 1.1;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok";
        }

        location /api/invoices/ {
            set $invoice_service http://invoice-service:8002;
            proxy_pass $invoice_service;
            error_page 502 503 504 = @service_unavailable;
        }

        location /api/contracts/ {
            set $contract_service http://contract-service:8001;
            proxy_pass $contract_service;
            error_page 502 503 504 = @service_unavailable;
        }

        location /api/ {
            default_type application/json;
            return 404 '{"error":{"code":"NOT_FOUND","message":"We couldn\'t find what you were looking for.","details":{},"request_id":"$req_id"}}';
        }

        location @service_unavailable {
            default_type application/json;
            return 503 '{"error":{"code":"SERVICE_UNAVAILABLE","message":"This part of the app isn\'t responding right now. Please try again in a minute.","details":{},"request_id":"$req_id"}}';
        }

        location / {
            set $frontend http://frontend:80;
            proxy_pass $frontend;
            error_page 502 503 504 = @frontend_unavailable;
        }

        location @frontend_unavailable {
            default_type text/html;
            return 503 '<!doctype html><title>Please try again</title><p style="font:18px system-ui;padding:32px">The app is starting up. Please refresh in a moment. Reference: $req_id</p>';
        }
    }
}
